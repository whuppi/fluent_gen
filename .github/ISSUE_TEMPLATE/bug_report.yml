name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Describe the bug. Include the FTL, the call, the output you got, and any recorded FluentError.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Given this FTL: ...
        2. Calling: ...
        3. Expected ... but got ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Type inference
        - Generated accessors
        - The locale enum
        - Attributes / markup
        - Build-time diagnostics
        - Other
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: build.yaml options
      placeholder: Your fluent_gen builder options (base_locale, ftl_dir, ...).
      render: yaml

  - type: input
    id: version
    attributes:
      label: fluent_gen version
      placeholder: e.g. 0.1.0
    validations:
      required: true
